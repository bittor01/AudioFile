<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audio File Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Audio File Tools</h1>
    <div id="content">
        <p>Select a folder to process:</p>
        <button id="select-dir">Select Directory</button>
        <p id="selected-dir"></p>

        <div id="options">
            <label><input type="checkbox" id="convert-to-wav" checked> Convert to .wav</label><br>
            <label><input type="checkbox" id="normalize-wav" checked> Normalize .wav volume</label><br>
            <label><input type="checkbox" id="update-lnk" checked> Update .lnk shortcuts</label><br>
        </div>

        <button id="run-tools">Run</button>

        <div id="status">
            <h2>Progress</h2>
            <div id="progress-section">
                <div class="progress-container">
                    <label for="overall-progress">Overall Progress:</label>
                    <progress id="overall-progress" value="0" max="100"></progress>
                    <span id="overall-etr"></span>
                </div>
                <div class="progress-container">
                    <label for="task-progress">Task Progress:</label>
                    <progress id="task-progress" value="0" max="100"></progress>
                    <span id="task-etr"></span>
                </div>
            </div>
            <h2>Status Log</h2>
            <pre id="status-output"></pre>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
